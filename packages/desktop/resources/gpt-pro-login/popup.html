<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="popupTitle">Connect ChatGPT</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <p class="login-status" role="status">
      <span data-i18n="loginStatusLabel">ChatGPT login status</span>:
      <strong id="login-state" data-i18n="statusChecking">Checking…</strong>
    </p>
    <label class="consent">
      <input id="consent" type="checkbox" />
      <span data-i18n="consent">I authorize importing this ChatGPT session into OpenCode on this computer.</span>
    </label>
    <button id="connect" data-state="idle" aria-busy="false" disabled>
      <svg id="connect-success" viewBox="0 0 24 24" fill="none" aria-hidden="true" hidden>
        <path
          d="m5 12 4 4L19 6"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
      <span id="connect-label" data-i18n="connect" aria-live="polite">Import session</span>
    </button>
    <p id="status" role="status" aria-live="polite" data-i18n="statusApproval">Approve before importing.</p>
    <script type="module" src="popup.js"></script>
  </body>
</html>
