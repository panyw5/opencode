<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="popupTitle">Connect ChatGPT</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <p class="login-status" role="status">
      <span data-i18n="loginStatusLabel">ChatGPT login status</span>:
      <strong id="login-state" data-i18n="statusChecking">Checking…</strong>
    </p>
    <label class="consent">
      <input id="consent" type="checkbox" />
      <span data-i18n="consent">I authorize importing this ChatGPT session into OpenCode on this computer.</span>
    </label>
    <button id="connect" data-i18n="connect" disabled>Import session</button>
    <p id="status" role="status" aria-live="polite" data-i18n="statusApproval">Approve before importing.</p>
    <script type="module" src="popup.js"></script>
  </body>
</html>
