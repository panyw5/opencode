name: Build Windows Desktop
run-name: "Build Windows Desktop App"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., v1.2.1). Leave empty to skip release creation."
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-windows-desktop:
    runs-on: windows-latest
    env:
      APP_VERSION: ${{ inputs.version != '' && inputs.version || github.ref_name }}
      OPENCODE_CHANNEL: prod
      RUST_TARGET: x86_64-pc-windows-msvc
      # GitHub-hosted Windows runners are x64. Windows arm64 desktop builds and
      # runtime smoke tests require a Windows arm64 self-hosted release runner.
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install

      - name: Prepare Desktop
        run: |
          $rootVersion = $env:APP_VERSION -replace '^v', ''
          if ($rootVersion -notmatch '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$') {
            $base = (Get-Content VERSION).Trim()
            $tag = [regex]::Replace($env:APP_VERSION.ToLowerInvariant(), '[^0-9a-z-]+', '-').Trim('-')
            if ([string]::IsNullOrWhiteSpace($tag)) { $tag = 'dev' }
            $rootVersion = "$base-$tag.$env:GITHUB_RUN_NUMBER"
          }
          bun ./script/sync-version.ts $rootVersion
        shell: pwsh

      - name: Build Desktop App
        run: |
          cd packages/desktop
          bun run package:win

          $version = $env:APP_VERSION -replace '^v', ''
          $installer = Get-ChildItem -Path dist -Filter "*.exe" -File |
            Where-Object { $_.Name -notmatch "blockmap" } |
            Select-Object -First 1
          if (-not $installer) {
            throw "Windows installer was not produced"
          }
          Rename-Item -Path $installer.FullName -NewName "OpenCode_${version}_x64-setup.exe" -Force
          ./../../script/sign-windows.ps1 "dist/OpenCode_${version}_x64-setup.exe"
        shell: pwsh

      - name: Smoke test installed desktop app
        run: |
          $version = $env:APP_VERSION -replace '^v', ''
          $installer = Join-Path $PWD "packages/desktop/dist/OpenCode_${version}_x64-setup.exe"
          $smokeRoot = Join-Path $env:RUNNER_TEMP "OpenCode Smoke"
          $installRoot = Join-Path $smokeRoot "Install"
          $projectRoot = Join-Path $smokeRoot "Project With Spaces"
          $appData = Join-Path $smokeRoot "AppData"
          $localAppData = Join-Path $smokeRoot "LocalAppData"
          $userData = Join-Path $appData "ai.opencode.desktop"
          $database = Join-Path $userData "data/opencode/opencode.db"

          function Stop-OpenCodeProcess([System.Diagnostics.Process] $Process) {
            if ($Process -and -not $Process.HasExited) {
              & taskkill /PID $Process.Id /T /F *> $null
              $Process.WaitForExit(15000)
            }
          }

          function Wait-ForOpenCodeHealth([System.Diagnostics.Process] $Process) {
            for ($attempt = 0; $attempt -lt 90; $attempt++) {
              if ($Process.HasExited) {
                throw "OpenCode exited before its local sidecar was ready (exit code $($Process.ExitCode))."
              }

              $ready = Get-ChildItem -Path (Join-Path $userData "logs") -Filter "main.log" -Recurse -ErrorAction SilentlyContinue |
                Select-String -SimpleMatch "server ready" -Quiet
              if ((Test-Path -LiteralPath $database) -and $ready) {
                return
              }
              Start-Sleep -Seconds 1
            }

            throw "OpenCode did not create its sidecar database and report server readiness within 90 seconds."
          }

          Remove-Item -LiteralPath $smokeRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $projectRoot, $appData, $localAppData | Out-Null
          Set-Content -LiteralPath (Join-Path $projectRoot "README.md") -Value "Windows desktop smoke project"

          & $installer /S "/D=$installRoot"
          if ($LASTEXITCODE -ne 0) { throw "NSIS installation failed with exit code $LASTEXITCODE." }

          $executable = Join-Path $installRoot "OpenCode.exe"
          if (-not (Test-Path -LiteralPath $executable)) { throw "Installed OpenCode executable was not found at $executable." }

          $previousAppData = $env:APPDATA
          $previousLocalAppData = $env:LOCALAPPDATA
          $previousChannel = $env:OPENCODE_CHANNEL
          $env:APPDATA = $appData
          $env:LOCALAPPDATA = $localAppData
          $env:OPENCODE_CHANNEL = "prod"
          $first = $null
          $second = $null
          try {
            $first = Start-Process -FilePath $executable -ArgumentList @($projectRoot) -PassThru
            Wait-ForOpenCodeHealth $first
            Stop-OpenCodeProcess $first

            if (-not (Test-Path -LiteralPath $database)) { throw "OpenCode sidecar database was removed after the first shutdown." }
            $firstDatabaseWrite = (Get-Item -LiteralPath $database).LastWriteTimeUtc

            $second = Start-Process -FilePath $executable -ArgumentList @($projectRoot) -PassThru
            Wait-ForOpenCodeHealth $second
            if (-not (Test-Path -LiteralPath $database)) { throw "OpenCode did not preserve the user-data database after restart." }
            if ((Get-Item -LiteralPath $database).LastWriteTimeUtc -lt $firstDatabaseWrite) {
              throw "OpenCode user-data database timestamp moved backwards after restart."
            }
          } finally {
            Stop-OpenCodeProcess $second
            Stop-OpenCodeProcess $first
            $env:APPDATA = $previousAppData
            $env:LOCALAPPDATA = $previousLocalAppData
            $env:OPENCODE_CHANNEL = $previousChannel
          }
        shell: pwsh

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: opencode-desktop-windows-x64
          path: packages/desktop/dist/OpenCode_*_x64-setup.exe

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
        run: |
          $tag = $env:APP_VERSION
          $version = $tag -replace '^v', ''
          $asset = "packages/desktop/dist/OpenCode_${version}_x64-setup.exe"
          gh release view $tag -R $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag -R $env:GITHUB_REPOSITORY --draft --title $tag --target $env:GITHUB_SHA
          }
          gh release upload $tag $asset -R $env:GITHUB_REPOSITORY --clobber
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
