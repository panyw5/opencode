name: Build Windows Desktop
run-name: "Build Windows Desktop App"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g., v1.2.1); empty uses committed VERSION. Builds only."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build-windows-desktop:
    if: github.repository == 'panyw5/opencode'
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      REQUESTED_VERSION: ${{ inputs.version }}
      OPENCODE_CHANNEL: prod
      RUST_TARGET: x86_64-pc-windows-msvc
      # GitHub-hosted Windows runners are x64. Windows arm64 desktop builds and
      # runtime smoke tests require a Windows arm64 self-hosted release runner.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare Desktop
        run: |
          bun ./script/sync-version.ts "$env:REQUESTED_VERSION"
          if ($LASTEXITCODE -ne 0) { throw "Version validation/synchronization failed" }
          $rootVersion = (Get-Content VERSION).Trim()
          # Export the explicit version so the CLI sidecar build bakes the exact
          # release version instead of a "<version>-prod.<timestamp>" preview one.
          Add-Content -Path $env:GITHUB_ENV -Value "OPENCODE_VERSION=$rootVersion"
        shell: pwsh

      - name: Build Desktop App
        run: |
          $icon = Join-Path $PWD "packages/desktop/icons/prod/icon.ico"
          if (-not (Test-Path -LiteralPath $icon)) { throw "Windows prod icon is missing at $icon" }
          Write-Host "windows-icon source=$icon bytes=$((Get-Item -LiteralPath $icon).Length)"

          cd packages/desktop
          bun run package:win
          if ($LASTEXITCODE -ne 0) { throw "Windows desktop packaging failed" }

          $version = $env:OPENCODE_VERSION
          $installers = @(Get-ChildItem -Path dist -Filter "*.exe" -File | Where-Object { $_.Name -notmatch "blockmap" })
          if ($installers.Count -ne 1) {
            throw "Expected exactly one Windows installer; found $($installers.Count)"
          }
          $installer = $installers[0]
          Rename-Item -Path $installer.FullName -NewName "OpenCode_${version}_x64-setup.exe" -Force
          ./../../script/sign-windows.ps1 "dist/OpenCode_${version}_x64-setup.exe"

          $signedInstaller = "dist/OpenCode_${version}_x64-setup.exe"
          $hashHex = (Get-FileHash -LiteralPath $signedInstaller -Algorithm SHA512).Hash
          $hashBytes = New-Object byte[] ($hashHex.Length / 2)
          for ($i = 0; $i -lt $hashHex.Length; $i += 2) {
            $hashBytes[$i / 2] = [Convert]::ToByte($hashHex.Substring($i, 2), 16)
          }
          $sha512 = [Convert]::ToBase64String($hashBytes)
          $size = (Get-Item -LiteralPath $signedInstaller).Length
          $releaseDate = (Get-Date).ToUniversalTime().ToString("o")
          @"
          version: $version
          files:
            - url: OpenCode_${version}_x64-setup.exe
              sha512: $sha512
              size: $size
          path: OpenCode_${version}_x64-setup.exe
          sha512: $sha512
          releaseDate: '$releaseDate'
          "@ | Set-Content -LiteralPath "dist/latest.yml" -Encoding utf8
        shell: pwsh

      - name: Smoke test installed desktop app
        run: |
          $version = $env:OPENCODE_VERSION
          $installer = Join-Path $PWD "packages/desktop/dist/OpenCode_${version}_x64-setup.exe"
          $smokeRoot = Join-Path $env:RUNNER_TEMP "OpenCode Smoke"
          $installRoot = Join-Path $smokeRoot "Install"
          $projectRoot = Join-Path $smokeRoot "Project With Spaces"
          # Electron resolves appData before application code can override it,
          # so test the real Windows per-user location instead of a child-only
          # APPDATA override that may be ignored by the packaged executable.
          $userData = Join-Path $env:APPDATA "ai.opencode.desktop"
          $database = Join-Path $env:USERPROFILE ".local/share/opencode/opencode.db"
          $desktopLogs = Join-Path $userData "logs"
          $sidecarLogs = Join-Path $env:USERPROFILE ".local/share/opencode/log"
          Write-Host "smoke appData=$env:APPDATA"
          Write-Host "smoke userData=$userData"
          Write-Host "smoke sidecarDataHome=$(Join-Path $env:USERPROFILE '.local/share')"
          Write-Host "smoke expected database=$database"

          function Stop-OpenCodeProcess([System.Diagnostics.Process] $Process) {
            if ($Process -and -not $Process.HasExited) {
              & taskkill /PID $Process.Id /T /F *> $null
              $Process.WaitForExit(15000)
            }
          }

          function Wait-ForOpenCodeHealth([System.Diagnostics.Process] $Process) {
            for ($attempt = 0; $attempt -lt 90; $attempt++) {
              if ($Process.HasExited) {
                throw "OpenCode exited before its local sidecar was ready (exit code $($Process.ExitCode))."
              }

              $ready = Get-ChildItem -Path $desktopLogs -Filter "main.log" -Recurse -ErrorAction SilentlyContinue |
                Select-String -SimpleMatch "loading task finished" -Quiet
              if ((Test-Path -LiteralPath $database) -and $ready) {
                return
              }
              Start-Sleep -Seconds 1
            }

            $logFiles = @(Get-ChildItem -Path $userData,$sidecarLogs -Filter "*.log" -Recurse -ErrorAction SilentlyContinue)
            Write-Host "smoke timeout appData=$env:APPDATA userData=$userData userDataExists=$(Test-Path -LiteralPath $userData) database=$database databaseExists=$(Test-Path -LiteralPath $database) sidecarLogs=$sidecarLogs sidecarLogDirectoryExists=$(Test-Path -LiteralPath $sidecarLogs) logFiles=$($logFiles.Count)"
            foreach ($file in $logFiles) {
              Write-Host "--- smoke log path=$($file.FullName) ---"
              Get-Content -LiteralPath $file.FullName -Tail 100 -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_ }
            }
            throw "OpenCode did not finish local-server startup within 90 seconds (appData=$env:APPDATA userDataExists=$(Test-Path -LiteralPath $userData) databaseExists=$(Test-Path -LiteralPath $database) sidecarLogDirectoryExists=$(Test-Path -LiteralPath $sidecarLogs))."
          }

          Remove-Item -LiteralPath $smokeRoot -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $userData -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $projectRoot | Out-Null
          Set-Content -LiteralPath (Join-Path $projectRoot "README.md") -Value "Windows desktop smoke project"

          $installProcess = Start-Process -FilePath $installer -ArgumentList @("/S", "/D=$installRoot") -Wait -PassThru
          if ($installProcess.ExitCode -ne 0) { throw "NSIS installation failed with exit code $($installProcess.ExitCode)." }

          $executable = Join-Path $installRoot "OpenCode.exe"
          if (-not (Test-Path -LiteralPath $executable)) { throw "Installed OpenCode executable was not found at $executable." }

          Add-Type -AssemblyName System.Drawing
          $exeIcon = [System.Drawing.Icon]::ExtractAssociatedIcon($executable)
          if (-not $exeIcon) { throw "Installed OpenCode.exe has no associated icon." }
          Write-Host "windows-icon exe=$executable size=$($exeIcon.Width)x$($exeIcon.Height)"

          $first = $null
          $second = $null
          try {
            $first = Start-Process -FilePath $executable -ArgumentList @($projectRoot) -PassThru
            Wait-ForOpenCodeHealth $first
            Stop-OpenCodeProcess $first

            if (-not (Test-Path -LiteralPath $database)) { throw "OpenCode sidecar database was removed after the first shutdown." }
            $firstDatabaseWrite = (Get-Item -LiteralPath $database).LastWriteTimeUtc

            $second = Start-Process -FilePath $executable -ArgumentList @($projectRoot) -PassThru
            Wait-ForOpenCodeHealth $second
            if (-not (Test-Path -LiteralPath $database)) { throw "OpenCode did not preserve the user-data database after restart." }
            if ((Get-Item -LiteralPath $database).LastWriteTimeUtc -lt $firstDatabaseWrite) {
              throw "OpenCode user-data database timestamp moved backwards after restart."
            }
          } finally {
            Stop-OpenCodeProcess $second
            Stop-OpenCodeProcess $first
          }
        shell: pwsh

      - name: Verify installed sidecar version
        run: |
          $artifactVersion = $env:OPENCODE_VERSION
          $expectedVersion = $env:OPENCODE_VERSION
          $installer = Join-Path $PWD "packages/desktop/dist/OpenCode_${artifactVersion}_x64-setup.exe"
          if (-not (Test-Path -LiteralPath $installer)) { throw "Installer for sidecar verification was not found at $installer." }
          $verifyRoot = Join-Path $env:RUNNER_TEMP "OpenCode Sidecar Verify"
          $installRoot = Join-Path $verifyRoot "Install"

          Remove-Item -LiteralPath $verifyRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $installRoot | Out-Null

          $installProcess = Start-Process -FilePath $installer -ArgumentList @("/S", "/D=$installRoot") -Wait -PassThru
          if ($installProcess.ExitCode -ne 0) { throw "NSIS installation for sidecar verification failed with exit code $($installProcess.ExitCode)." }

          $sidecar = Join-Path $installRoot "resources/sidecars/opencode-cli-$($env:RUST_TARGET).exe"
          if (-not (Test-Path -LiteralPath $sidecar)) { throw "Installed sidecar was not found at $sidecar." }
          $updateConfig = Join-Path $installRoot "resources/app-update.yml"
          if (-not (Test-Path -LiteralPath $updateConfig)) { throw "Installed updater config was not found at $updateConfig." }

          # Capture the full output without piping through Select-Object: an
          # early-stopping pipeline can kill the process before it exits and
          # leaves $LASTEXITCODE unset.
          $output = @(& $sidecar --version)
          $sidecarExit = $LASTEXITCODE
          Write-Host "sidecar raw output: $($output -join ' | ')"
          if ($sidecarExit -ne 0) { throw "Installed sidecar --version failed with exit code $sidecarExit." }
          $sidecarVersion = (@($output | Where-Object { "$_".Trim() }) | Select-Object -First 1)
          $sidecarVersion = "$sidecarVersion".Trim()

          Write-Host "artifact version=$artifactVersion"
          Write-Host "expected version=$expectedVersion"
          Write-Host "sidecar path=$sidecar"
          Write-Host "sidecar version=$sidecarVersion"
          Write-Host "RUST_TARGET=$($env:RUST_TARGET)"
          Write-Host "updater config=$updateConfig"

          if ($env:OPENCODE_VERSION -ne $expectedVersion) { throw "Prepared version mismatch: got '$($env:OPENCODE_VERSION)', expected '$expectedVersion'." }
          if ($sidecarVersion -ne $expectedVersion) { throw "Installed sidecar version mismatch: got '$sidecarVersion', expected '$expectedVersion' (RUST_TARGET=$($env:RUST_TARGET))." }

          $updater = Get-Content -LiteralPath $updateConfig -Raw
          if ($updater -notmatch '(?m)^owner:\s*panyw5\s*$' -or $updater -notmatch '(?m)^repo:\s*opencode\s*$') {
            throw "Installed updater config must target panyw5/opencode."
          }
          if ($updater -match 'anomalyco') { throw "Installed updater config must not target anomalyco." }
        shell: pwsh

      - name: Create Windows artifact manifest
        shell: pwsh
        run: |
          $staging = Join-Path $env:RUNNER_TEMP "desktop-artifacts"
          New-Item -ItemType Directory -Path $staging | Out-Null
          Copy-Item -LiteralPath "packages/desktop/dist/OpenCode_$($env:OPENCODE_VERSION)_x64-setup.exe" -Destination $staging
          Copy-Item -LiteralPath "packages/desktop/dist/latest.yml" -Destination $staging
          bun script/desktop-artifacts.ts create --platform windows --arch x64 --directory $staging

      - name: Upload Windows Installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opencode-desktop-windows-x64
          path: ${{ runner.temp }}/desktop-artifacts/*
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
