  create-draft-release:
    needs: [build-macos-x64, build-macos-arm64]
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ inputs.version != '' && inputs.version || github.ref_name }}
      WINDOWS_RUN_ID: ${{ inputs.windows_run_id }}
    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: opencode-desktop-macos-*
          path: release-assets
          merge-multiple: true

      - name: Download macOS updater artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: opencode-desktop-macos-*-updater
          path: release-assets/updater
          merge-multiple: true

      - name: Download matching Windows artifact
        run: |
          for _ in $(seq 1 120); do
            RUN="$(gh run view "$WINDOWS_RUN_ID" -R "$GITHUB_REPOSITORY" --json event,headSha,status,conclusion,workflowName)"
            WINDOWS_SHA="$(printf '%s' "$RUN" | jq -r '.headSha')"
            WINDOWS_EVENT="$(printf '%s' "$RUN" | jq -r '.event')"
            WINDOWS_WORKFLOW="$(printf '%s' "$RUN" | jq -r '.workflowName')"
            WINDOWS_STATUS="$(printf '%s' "$RUN" | jq -r '.status')"
            WINDOWS_CONCLUSION="$(printf '%s' "$RUN" | jq -r '.conclusion // empty')"
            [ "$WINDOWS_SHA" = "$GITHUB_SHA" ] || { echo "Windows run head SHA mismatch: $WINDOWS_SHA != $GITHUB_SHA"; exit 1; }
            [ "$WINDOWS_EVENT" = "workflow_dispatch" ] || { echo "Windows run event mismatch: $WINDOWS_EVENT"; exit 1; }
            [ "$WINDOWS_WORKFLOW" = "Build Windows Desktop" ] || { echo "Windows workflow mismatch: $WINDOWS_WORKFLOW"; exit 1; }
            if [ "$WINDOWS_STATUS" = "completed" ]; then
              [ "$WINDOWS_CONCLUSION" = "success" ] || { echo "matching Windows run $WINDOWS_RUN_ID failed: $WINDOWS_CONCLUSION"; exit 1; }
              break
            fi
            sleep 30
          done
          [ "$WINDOWS_STATUS" = "completed" ] && [ "$WINDOWS_CONCLUSION" = "success" ] || { echo "matching successful Windows run did not complete in time"; exit 1; }
          printf 'windows run id=%s\nwindows head sha=%s\n' "$WINDOWS_RUN_ID" "$WINDOWS_SHA"
          mkdir -p release-assets/windows
          gh run download "$WINDOWS_RUN_ID" -R "$GITHUB_REPOSITORY" -n opencode-desktop-windows-x64 -D release-assets/windows
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare release assets
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
        run: |
          TAG="${APP_VERSION}"
          VERSION="${TAG#v}"
          X64="release-assets/OpenCode_${VERSION}_x64.dmg"
          ARM64="release-assets/OpenCode_${VERSION}_aarch64.dmg"
          WINDOWS="release-assets/windows/OpenCode_${VERSION}_x64-setup.exe"
          MAC_X64_ZIP="release-assets/updater/opencode-desktop-mac-x64.zip"
          MAC_ARM64_ZIP="release-assets/updater/opencode-desktop-mac-arm64.zip"
          MAC_X64_METADATA="release-assets/updater/latest-mac-x64.yml"
          MAC_ARM64_METADATA="release-assets/updater/latest-mac-arm64.yml"
          MAC_METADATA="release-assets/latest-mac.yml"
          WINDOWS_METADATA="release-assets/windows/latest.yml"
          test -f "$X64"
          test -f "$ARM64"
          test -f "$WINDOWS"
          test -f "$MAC_X64_ZIP"
          test -f "$MAC_ARM64_ZIP"
          test -f "$MAC_X64_METADATA"
          test -f "$MAC_ARM64_METADATA"
          test -f "$WINDOWS_METADATA"
          ruby -ryaml -e '
            x64 = YAML.load_file(ARGV[0])
            arm64 = YAML.load_file(ARGV[1])
            files = Array(x64["files"]) + Array(arm64["files"])
            abort "macOS updater metadata has no files" if files.empty?
            metadata = {
              "version" => x64.fetch("version"),
              "files" => files,
              "releaseDate" => x64["releaseDate"] || arm64["releaseDate"],
            }
            File.write(ARGV[2], metadata.to_yaml)
          ' "$MAC_X64_METADATA" "$MAC_ARM64_METADATA" "$MAC_METADATA"
          printf 'release target=%s\nx64 asset=%s\narm64 asset=%s\nwindows asset=%s\nmac metadata=%s\nwindows metadata=%s\n' "$GITHUB_SHA" "$X64" "$ARM64" "$WINDOWS" "$MAC_METADATA" "$WINDOWS_METADATA"

      - name: Upload consolidated release assets
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
        uses: actions/upload-artifact@v4
        with:
          name: opencode-desktop-release-assets
          path: |
            release-assets/OpenCode_*.dmg
            release-assets/windows/OpenCode_*_x64-setup.exe
            release-assets/updater/opencode-desktop-mac-*.zip
            release-assets/latest-mac.yml
            release-assets/windows/latest.yml
          if-no-files-found: error

      - name: Create draft release
        if: (startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.version != '')) && inputs.artifact_only != true
        run: |
          TAG="${APP_VERSION}"
          VERSION="${TAG#v}"
          X64="release-assets/OpenCode_${VERSION}_x64.dmg"
          ARM64="release-assets/OpenCode_${VERSION}_aarch64.dmg"
          WINDOWS="release-assets/windows/OpenCode_${VERSION}_x64-setup.exe"
          MAC_X64_ZIP="release-assets/updater/opencode-desktop-mac-x64.zip"
          MAC_ARM64_ZIP="release-assets/updater/opencode-desktop-mac-arm64.zip"
          MAC_METADATA="release-assets/latest-mac.yml"
          WINDOWS_METADATA="release-assets/windows/latest.yml"
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft --title "$TAG" --target "$GITHUB_SHA" \
            "$X64" "$ARM64" "$WINDOWS" "$MAC_X64_ZIP" "$MAC_ARM64_ZIP" "$MAC_METADATA" "$WINDOWS_METADATA"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
