name: Build macOS Desktop (Reusable)

on:
  workflow_call:
    inputs:
      arch:
        description: "Architecture enum: x64 or arm64 (validated before building)"
        required: true
        type: string
      version:
        description: "Optional semver version (defaults to committed VERSION)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-macos-${{ inputs.arch }}-${{ github.ref }}-${{ inputs.version || 'VERSION' }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'panyw5/opencode'
    runs-on: ${{ inputs.arch == 'x64' && 'macos-15-intel' || 'macos-15' }}
    timeout-minutes: 180
    env:
      ARCH: ${{ inputs.arch }}
      VERSION_INPUT: ${{ inputs.version }}
      OPENCODE_CHANNEL: prod
      RUST_TARGET: ${{ inputs.arch == 'x64' && 'x86_64-apple-darwin' || 'aarch64-apple-darwin' }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      CSC_NAME: "Yiwen Pan (8L95FJ9774)"
      NOTARY_PROFILE: opencode-notary-ci
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Validate architecture
        run: |
          case "$ARCH" in x64|arm64) ;; *) printf 'Invalid architecture: %s\n' "$ARCH"; exit 1 ;; esac

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare version
        run: |
          bun ./script/sync-version.ts "$VERSION_INPUT"
          printf 'OPENCODE_VERSION=%s\n' "$(< VERSION)" >> "$GITHUB_ENV"

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash script/desktop-macos.sh import

      - name: Build and notarize App and final DMG
        # Two notary submissions each have a 60m bound, within the job's 180m budget.
        timeout-minutes: 160
        run: bash script/desktop-macos.sh build

      - name: Verify App, ZIP and final DMG
        run: bash script/desktop-macos.sh verify

      - name: Create artifact manifest
        run: |
          STAGING="$RUNNER_TEMP/desktop-artifacts"
          mkdir -p "$STAGING"
          DMG_ARCH=x64
          if [ "$ARCH" = arm64 ]; then DMG_ARCH=aarch64; fi
          cp "packages/desktop/dist/OpenCode_${OPENCODE_VERSION}_${DMG_ARCH}.dmg" "$STAGING/"
          cp "packages/desktop/dist/opencode-desktop-mac-${ARCH}.zip" "$STAGING/"
          cp "packages/desktop/dist/latest-mac-${ARCH}.yml" "$STAGING/"
          bun script/desktop-artifacts.ts create --platform macos --arch "$ARCH" --directory "$STAGING"

      - name: Upload verified macOS artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opencode-desktop-macos-${{ inputs.arch }}
          path: ${{ runner.temp }}/desktop-artifacts/*
          retention-days: 14
          compression-level: 0
          if-no-files-found: error

      - name: Remove signing keychain
        if: always()
        run: bash script/desktop-macos.sh cleanup
